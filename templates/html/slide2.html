<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>slide2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{margin:0;width:1080px;height:1350px;overflow:hidden}
body{
  background:#EEF3F8;
  font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;
  color:#111111;
  position:relative;
  word-break:keep-all;
  -webkit-font-smoothing:antialiased;
}
.gridlines{position:absolute;inset:0;pointer-events:none}
.gridlines i{position:absolute;top:0;bottom:0;width:1px;background:rgba(82,120,174,.055)}
.gridlines i:nth-child(1){left:270px}
.gridlines i:nth-child(2){left:540px}
.gridlines i:nth-child(3){left:810px}

/* header — anchor: top 76 / inset 84 / h 44 (identical on all 4 slides) */
.header{position:absolute;top:76px;left:84px;right:84px;height:44px;
  display:flex;justify-content:space-between;align-items:center}
.header img{width:172px;height:44px;display:block}
.folio{font-size:26px;font-weight:500;color:#8AA6CC;letter-spacing:.08em}
.folio b{color:#5278AE;font-weight:800}

/* ghost step number — below header line, same anchor as slide3 */
.ghost{position:absolute;top:170px;right:60px;
  font-size:340px;font-weight:900;line-height:1;letter-spacing:-.04em;
  color:transparent;-webkit-text-stroke:2.5px #CBDAEB;user-select:none}

/* kicker */
.kicker{position:absolute;left:84px;top:238px;display:flex;align-items:center;gap:18px}
.kicker .bar{width:44px;height:3px;background:#5278AE}
.kicker b{font-size:26px;font-weight:800;color:#5278AE;letter-spacing:.1em}
.kicker .sep{font-size:26px;color:#8AA6CC;font-weight:700}
.kicker span{font-size:26px;font-weight:700;color:#111111;letter-spacing:-.01em}

/* title */
h1{position:absolute;left:84px;top:296px;
  font-size:92px;font-weight:900;line-height:1.24;letter-spacing:-.035em;color:#111111}
h1 em{font-style:normal;color:#5278AE}
.dot{display:inline-block;width:16px;height:16px;border-radius:50%;
  background:#EE0000;margin-left:14px;margin-bottom:8px}

/* body card — series token: radius 28 / shadow 0 18px 50px .08 */
.card{position:absolute;left:84px;right:84px;top:620px;height:566px;
  background:#FFFFFF;border-radius:28px;
  box-shadow:0 18px 50px rgba(22,36,60,.08);
  padding:60px 68px}
.card p{font-size:34px;font-weight:500;color:#111111;
  line-height:1.55;letter-spacing:-.02em}
.card p b{font-weight:800;color:#111111}
.divider{height:1px;background:#DCE6F1;margin:40px 0 38px}
.point{display:flex;align-items:center;gap:24px;margin-bottom:24px}
.point:last-child{margin-bottom:0}
.point .ic{width:48px;height:48px;border-radius:50%;background:#E2EBF5;
  display:flex;align-items:center;justify-content:center;flex:none}
.point span{font-size:33px;font-weight:700;color:#111111;letter-spacing:-.02em}

/* footer — anchor: bottom 74 / inset 84 (identical on all 4 slides) */
.footer{position:absolute;left:84px;right:84px;bottom:74px;
  display:flex;justify-content:space-between;align-items:center}
.tag{font-size:19px;font-weight:600;letter-spacing:.24em;color:#8AA6CC}
.swipe{display:flex;align-items:center;gap:16px;
  font-size:24px;font-weight:600;color:#111111;letter-spacing:-.01em}
</style>
</head>
<body>
  <div class="gridlines"><i></i><i></i><i></i></div>

  <div class="header">
    <img src="../../brand/logo_korea_bk.svg" alt="한국투자신탁운용">
    <div class="folio"><b>02</b> / 04</div>
  </div>

  <div class="ghost">01</div>

  <div class="kicker">
    <span class="bar"></span><b>STEP 1</b><span class="sep">·</span><span>ETF란?</span>
  </div>

  <h1>주식처럼<br>사고파는 <em>펀드</em><span class="dot"></span></h1>

  <div class="card">
    <p><b>ETF(상장지수펀드)</b>는 특정 지수를 따라가도록 설계되어 거래소에 상장된 펀드예요.<br>주식처럼 실시간으로 사고팔 수 있습니다.</p>
    <div class="divider"></div>
    <div class="point">
      <span class="ic"><svg width="26" height="26" viewBox="0 0 26 26" fill="none"><path d="M4 14l6.5 6.5L22 6" stroke="#5278AE" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span>실시간 매매 가능</span>
    </div>
    <div class="point">
      <span class="ic"><svg width="26" height="26" viewBox="0 0 26 26" fill="none"><path d="M4 14l6.5 6.5L22 6" stroke="#5278AE" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span>한 종목으로 분산투자</span>
    </div>
    <div class="point">
      <span class="ic"><svg width="26" height="26" viewBox="0 0 26 26" fill="none"><path d="M4 14l6.5 6.5L22 6" stroke="#5278AE" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span>상대적으로 낮은 보수</span>
    </div>
  </div>

  <div class="footer">
    <span class="tag">ETF BASIC GUIDE</span>
    <span class="swipe">옆으로 넘겨보세요
      <svg width="64" height="18" viewBox="0 0 64 18" fill="none">
        <path d="M0 9h58M50 1.5L59.5 9 50 16.5" stroke="#5278AE" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
  </div>
</body>
</html>
