<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{margin:0;width:1080px;height:1350px;overflow:hidden}
  body{
    font-family:'Pretendard',sans-serif;
    background:#16243C;
    position:relative;
    color:#FFFFFF;
    -webkit-font-smoothing:antialiased;
  }
  .bg{
    position:absolute;inset:0;
    background:
      radial-gradient(1000px 780px at 14% 6%, rgba(82,120,174,.20), transparent 68%),
      linear-gradient(158deg,#243B60 0%,#16243C 62%);
  }
  /* concentric rings — shared series motif */
  .rings{position:absolute;top:-300px;right:-320px}
  /* giant outlined 3 */
  .giant{
    position:absolute;right:-36px;bottom:150px;
    font-size:640px;font-weight:900;line-height:1;
    color:transparent;
    -webkit-text-stroke:2px rgba(138,166,204,.20);
    letter-spacing:-0.02em;
  }
  /* top bar */
  .topbar{
    position:absolute;left:84px;right:84px;top:84px;height:44px;
    display:flex;justify-content:space-between;align-items:center;
  }
  .topbar img{height:44px;display:block}
  .dots{display:flex;gap:10px;align-items:center}
  .dot{width:10px;height:10px;border-radius:5px;background:rgba(138,166,204,.32)}
  .dot.on{width:34px;background:#8AA6CC}
  /* badge */
  .badge{
    position:absolute;left:84px;top:338px;
    display:inline-flex;align-items:center;gap:14px;
    padding:17px 32px;border-radius:999px;
    border:1px solid rgba(138,166,204,.45);
    background:rgba(82,120,174,.16);
    font-size:27px;font-weight:600;letter-spacing:-0.01em;color:#DCE6F2;
  }
  .badge .tick{width:9px;height:9px;border-radius:50%;background:#8AA6CC}
  /* title */
  .title{
    position:absolute;left:84px;top:446px;
    font-size:98px;font-weight:900;line-height:1.24;letter-spacing:-0.035em;
  }
  .title .hl{color:#8AA6CC}
  /* sub copy */
  .sub{
    position:absolute;left:84px;top:864px;
    display:flex;align-items:center;gap:22px;
  }
  .sub .bar{width:56px;height:3px;background:#5278AE;border-radius:2px}
  .sub .txt{font-size:34px;font-weight:500;letter-spacing:-0.02em;color:rgba(220,230,242,.85)}
  /* swipe */
  .swipe{
    position:absolute;right:84px;bottom:84px;
    display:flex;align-items:center;gap:26px;
  }
  .swipe .label{font-size:28px;font-weight:600;letter-spacing:-0.02em;color:#8AA6CC}
  .swipe .circle{
    width:88px;height:88px;border-radius:50%;
    border:1.5px solid rgba(138,166,204,.5);
    background:rgba(82,120,174,.22);
    display:flex;align-items:center;justify-content:center;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <svg class="rings" width="820" height="820" viewBox="0 0 820 820" fill="none">
    <circle cx="410" cy="410" r="196" stroke="#5278AE" stroke-opacity=".26" stroke-width="1.5"/>
    <circle cx="410" cy="410" r="292" stroke="#5278AE" stroke-opacity=".16" stroke-width="1.5"/>
    <circle cx="410" cy="410" r="392" stroke="#5278AE" stroke-opacity=".09" stroke-width="1.5"/>
  </svg>
  <div class="giant">3</div>

  <div class="topbar">
    <img src="../../brand/logo_korea_wh.svg" alt="한국투자신탁운용">
    <div class="dots">
      <div class="dot on"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
  </div>

  <div class="badge"><span class="tick"></span>한국투자신탁운용 서포터즈</div>

  <div class="title">
    ETF 투자,<br>
    시작 전 <span class="hl">딱 3가지</span>만<br>
    확인하세요
  </div>

  <div class="sub">
    <div class="bar"></div>
    <div class="txt">처음 시작하는 사람을 위한 ETF 기초 가이드</div>
  </div>

  <div class="swipe">
    <div class="label">옆으로 넘겨보세요</div>
    <div class="circle">
      <svg width="34" height="26" viewBox="0 0 34 26" fill="none">
        <path d="M2 13H30M30 13L20 3M30 13L20 23" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>
</body>
</html>
